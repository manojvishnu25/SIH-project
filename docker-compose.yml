version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: aerovista_postgis
    environment:
      POSTGRES_DB: aerovista
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerovista_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/aerovista
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerovista_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgis_data:
